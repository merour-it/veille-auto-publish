name: Veille technologique — publication quotidienne (GitHub Pages)

on:
  schedule:
    - cron: "35 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer le rapport depuis SharePoint et générer la page
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FILE_NAME: ${{ vars.SHAREPOINT_FILE_NAME }}
          OUTPUT_DIR: public
        run: python fetch_and_publish.py

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
